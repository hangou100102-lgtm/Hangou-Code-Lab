<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangou</title>
  <meta name="description" content="憨狗的个人小站：写代码也做视频，这里放一些零零散散的想法。" />
  <!-- 闪屏防护：在 React 挂载前先把主题预设到 <html data-theme>，避免深色用户看到白屏 -->
  <script>(function(){try{var t=localStorage.getItem('hcl-theme');if(t==='light'||(t==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)){document.documentElement.setAttribute('data-theme','light')}}catch(e){}})();</script>
  <link rel="icon" type="image/png" href="%BASE_URL%images/avatar.png?v=2" />
  <meta name="theme-color" content="#0d0e11" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
